<div style="width:240px;height:64px;overflow:hidden;position:relative;background:#1a1917;">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.6);animation:scrim 3s ease-in-out infinite;"></div>
    <div style="position:absolute;top:50%;left:50%;width:160px;background:#2a2825;border:1px solid #c8b89a;border-radius:6px;padding:8px;box-sizing:border-box;animation:card 3s ease-in-out infinite;">
      <div style="width:80px;height:3px;background:#c8b89a;border-radius:2px;opacity:0.9;margin-bottom:5px;"></div>
      <div style="width:110px;height:2px;background:#c8b89a;border-radius:2px;opacity:0.4;margin-bottom:8px;"></div>
      <div style="display:flex;gap:6px;">
        <div style="flex:1;height:12px;border:1px solid #c8b89a;border-radius:3px;opacity:0.7;"></div>
        <div style="flex:1;height:12px;background:#c8b89a;border-radius:3px;opacity:0.9;"></div>
      </div>
    </div>
  </div>
  <style>
  @keyframes scrim {
    0%,10%  { opacity:0; }
    25%,70% { opacity:1; }
    85%,100%{ opacity:0; }
  }
  @keyframes card {
    0%,10%  { opacity:0; transform:translate(-50%,-50%) scale(0.85); }
    25%,70% { opacity:1; transform:translate(-50%,-50%) scale(1); }
    85%,100%{ opacity:0; transform:translate(-50%,-50%) scale(0.85); }
  }
  </style>
