<div style="width:240px;height:64px;overflow:hidden;position:relative;background:#1a1917;display:flex;align-items:center;justify-content:center;">
    <div style="position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(200,184,154,0.3);animation:ring 2.5s ease-out infinite;"></div>
    <div style="position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(200,184,154,0.15);animation:ring 2.5s ease-out infinite 0.4s;"></div>
    <div style="width:32px;height:32px;border-radius:50%;background:#c8b89a;display:flex;align-items:center;justify-content:center;position:relative;animation:pulse 2.5s ease-in-out infinite;">
      <div style="position:absolute;width:12px;height:2px;background:#1a1917;border-radius:1px;"></div>
      <div style="position:absolute;width:2px;height:12px;background:#1a1917;border-radius:1px;"></div>
    </div>
  </div>
  <style>
  @keyframes ring {
    0%   { transform:scale(1); opacity:0.6; }
    100% { transform:scale(2.2); opacity:0; }
  }
  @keyframes pulse {
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.08); }
  }
  </style>
