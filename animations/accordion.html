<div style="width:240px;height:64px;overflow:hidden;position:relative;background:#1a1917;padding:4px 8px;box-sizing:border-box;">
    <div style="height:14px;background:#2a2825;border-radius:2px;margin-bottom:2px;display:flex;align-items:center;padding:0 8px;border:0.5px solid #c8b89a;opacity:0.5;">
      <div style="width:60px;height:3px;background:#c8b89a;border-radius:2px;opacity:0.6;"></div>
      <div style="margin-left:auto;width:6px;height:6px;border-right:1.5px solid #c8b89a;border-bottom:1.5px solid #c8b89a;transform:rotate(45deg);opacity:0.6;"></div>
    </div>
    <div style="background:#2a2825;border-radius:2px;margin-bottom:2px;border:0.5px solid #c8b89a;overflow:hidden;animation:expand 3s ease-in-out infinite;">
      <div style="height:14px;display:flex;align-items:center;padding:0 8px;">
        <div style="width:50px;height:3px;background:#c8b89a;border-radius:2px;opacity:0.9;"></div>
        <div style="margin-left:auto;width:6px;height:6px;border-right:1.5px solid #c8b89a;border-bottom:1.5px solid #c8b89a;transform:rotate(-135deg);opacity:0.9;"></div>
      </div>
      <div style="animation:reveal 3s ease-in-out infinite;overflow:hidden;">
        <div style="height:3px;background:#c8b89a;border-radius:2px;margin:3px 8px;opacity:0.3;"></div>
        <div style="height:3px;background:#c8b89a;border-radius:2px;margin:3px 8px 4px;opacity:0.3;width:70%;"></div>
      </div>
    </div>
    <div style="height:14px;background:#2a2825;border-radius:2px;display:flex;align-items:center;padding:0 8px;border:0.5px solid #c8b89a;opacity:0.5;">
      <div style="width:55px;height:3px;background:#c8b89a;border-radius:2px;opacity:0.6;"></div>
      <div style="margin-left:auto;width:6px;height:6px;border-right:1.5px solid #c8b89a;border-bottom:1.5px solid #c8b89a;transform:rotate(45deg);opacity:0.6;"></div>
    </div>
  </div>
  <style>
  @keyframes expand {
    0%,10%  { max-height:14px; }
    25%,70% { max-height:40px; }
    85%,100%{ max-height:14px; }
  }
  @keyframes reveal {
    0%,10%  { opacity:0; max-height:0; }
    25%,70% { opacity:1; max-height:20px; }
    85%,100%{ opacity:0; max-height:0; }
  }
  </style>
