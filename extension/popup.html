<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forma</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 280px;
      background: #0a0a09;
      color: #f0ece4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid #2a2825;
    }
    
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #c8b89a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0a0a09;
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
    }
    
    .brand {
      font-size: 16px;
      font-weight: 600;
      color: #f0ece4;
      letter-spacing: 0.02em;
    }
    
    .tagline {
      font-size: 10px;
      color: #6b6560;
      margin-top: 2px;
      letter-spacing: 0.05em;
    }
    
    .status-card {
      background: #1c1a17;
      border: 0.5px solid #2a2825;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    
    .status-label {
      font-size: 11px;
      color: #a0998c;
      letter-spacing: 0.03em;
    }
    
    .status-value {
      font-size: 11px;
      color: #4ade80;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    
    .info {
      font-size: 11px;
      color: #6b6560;
      line-height: 1.5;
      margin-top: 12px;
      padding: 10px;
      background: rgba(200, 184, 154, 0.05);
      border-radius: 6px;
      border-left: 2px solid #c8b89a;
    }
    
    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid #2a2825;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .footer-text {
      font-size: 9px;
      color: #6b6560;
      font-family: monospace;
    }
    
    .footer-version {
      font-size: 9px;
      color: #c8b89a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">F</div>
    <div>
      <div class="brand">Forma</div>
      <div class="tagline">UI TERMINOLOGY ASSISTANT</div>
    </div>
  </div>
  
  <div class="status-card">
    <div class="status-row">
      <div class="status-label">Status</div>
      <div class="status-value">
        <div class="pulse"></div>
        Active
      </div>
    </div>
  </div>
  
  <div class="status-card">
    <div class="status-row">
      <div class="status-label">Detection Mode</div>
      <div class="status-value" id="detection-mode">KEYWORD</div>
    </div>
  </div>
  
  <div class="status-card">
    <div class="status-row">
      <div class="status-label">Powered By</div>
      <div class="status-value">AMD MI300X</div>
    </div>
  </div>
  
  <div class="info">
    Forma analyzes vague UI descriptions in any text field and 
    suggests precise design terminology. Just type and hover the 
    amber underlines.
  </div>
  
  <div class="footer">
    <div class="footer-text">Llama 3.1 8B</div>
    <div class="footer-version">v1.0.0</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
