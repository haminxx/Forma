[package]
name = "lexis"
version = "0.1.0"
description = "Lexis — prompt vocabulary assistant"
authors = ["Lexis"]
license = "TBD"
repository = "https://github.com/haminxx/Lexis"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lexis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lexis"
path = "src/main.rs"

[[bin]]
name = "lexis_cli"
path = "src/bin/lexis_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / utilities
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
crossbeam-channel = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
# NOTE: FTS5 is enabled via the "bundled" feature. sqlite-vss is wired
# behind the "semantic" feature (Phase 7).

# Text processing
regex = "1"
unicode-segmentation = "1.12"
strsim = "0.11"

# Clipboard + keystroke simulation (The Hands)
arboard = "3.4"
enigo = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI (for lexis_cli)
clap = { version = "4", features = ["derive"] }

# Optional: ONNX runtime for Phase 7 (semantic embeddings).
# Kept behind a feature flag so the default build stays lean.
ort = { version = "2.0.0-rc.5", optional = true, default-features = false, features = ["download-binaries"] }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }

[features]
default = []
semantic = ["dep:ort", "dep:tokenizers"]

# ---- Platform-specific dependencies ----

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
windows-core = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.22"
zbus = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
